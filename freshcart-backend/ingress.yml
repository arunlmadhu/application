apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: freshcart-backend
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # The app serves both the static UI ("/") and the REST API ("/api/...")
    # from the same jar, so everything routes to the one backend Service.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - freshcart.example.com
      secretName: freshcart-backend-tls
  rules:
    - host: freshcart.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: freshcart-backend
                port:
                  number: 80
