spring:
  application:
    name: freshcart-backend

  # Default/dev profile: in-memory H2 so the app runs with zero setup.
  # Activate the "prod" profile (see application-prod.yml) to point at AWS RDS.
  datasource:
    url: jdbc:h2:mem:freshcart;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # Override with a long random value via the JWT_SECRET env var in every
    # real deployment. Never reuse this default outside local development.
    secret: ${JWT_SECRET:dev-only-local-secret-change-me-32chars-minimum}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:3000}
  admin:
    email: ${ADMIN_EMAIL:admin@freshcart.com}
    password: ${ADMIN_PASSWORD:Admin@123}

logging:
  level:
    com.freshcart.backend: INFO
