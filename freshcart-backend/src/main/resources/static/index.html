<!-- ============================================================
     PRODUCTION NOTE:
     This app uses React + Babel via CDN so it can run as a pure
     static site with NO npm install / build step. This is ideal
     for quickly hosting on S3, Netlify, GitHub Pages, Azure
     Static Web Apps, etc. For a large production app, you would
     normally pre-compile JSX with a bundler (Vite/CRA) for better
     performance, but that requires a Node build step which you
     said you cannot run. This CDN approach needs zero dependency
     installation - just upload the files as-is.
     ============================================================ -->
